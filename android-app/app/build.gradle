/* Приложение-оболочка: весь интерфейс лежит внутри пакета, в app/src/main/assets/www.
   Название, версия и имя пакета приходят из переменных окружения — их задаёт
   сборка, чтобы не править этот файл руками. */

plugins {
    id 'com.android.application'
}

android {
    namespace 'app.wolffmsg.shell'
    compileSdk 34

    defaultConfig {
        applicationId System.getenv('APP_ID') ?: 'app.wolffmsg.shell'
        minSdk 23
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
        versionName System.getenv('APP_VERSION_NAME') ?: '1.0.0'
        resValue 'string', 'app_name', (System.getenv('APP_NAME') ?: 'WolffMsg')
    }

    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_PATH')) {
                storeFile file(System.getenv('KEYSTORE_PATH'))
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'wolffmsg'
                keyAlias System.getenv('KEY_ALIAS') ?: 'wolffmsg'
                keyPassword System.getenv('KEY_PASSWORD') ?:
                        (System.getenv('KEYSTORE_PASSWORD') ?: 'wolffmsg')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    /* Проверка стиля кода не должна ронять сборку приложения: она ищет поводы
       для придирок, а нам нужен готовый файл. */
    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}
