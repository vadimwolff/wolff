name: Собрать APK

# Запускается вручную: Actions → «Собрать APK» → Run workflow.
# На выходе — подписанные APK (поставить на телефон) и AAB (для магазина).

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Адрес сервера переписки (https://имя.vercel.app)'
        required: true
        type: string
      kind:
        description: 'Что собирать'
        required: true
        default: 'встроенное приложение'
        type: choice
        options:
          - 'встроенное приложение'
          - 'обёртка над сайтом'
      name:
        description: 'Название приложения на телефоне'
        required: false
        default: 'WolffMsg'
        type: string
      package:
        description: 'Имя пакета (пусто — получится из адреса сайта)'
        required: false
        default: ''
        type: string
      version:
        description: 'Версия приложения, например 1.0.0'
        required: false
        default: '1.0.0'
        type: string

permissions:
  contents: read

jobs:

  # ------------------------------------------------------------------------
  #  Встроенное приложение: весь интерфейс лежит внутри пакета и открывается
  #  сразу, без интернета. В сеть приложение ходит только за перепиской.
  # ------------------------------------------------------------------------
  offline:
    if: inputs.kind == 'встроенное приложение'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Уложить приложение внутрь пакета
        run: node tools/android-assets.mjs "${{ inputs.site }}"

      - name: Ключ подписи
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bash tools/android-keystore.sh "${{ inputs.name }}"

      - name: Собрать APK и AAB
        env:
          APP_ID: ${{ inputs.package }}
          APP_NAME: ${{ inputs.name }}
          APP_VERSION_NAME: ${{ inputs.version }}
          KEYSTORE_PATH: ${{ github.workspace }}/android.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'wolffmsg' }}
          KEY_ALIAS: wolffmsg
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'wolffmsg' }}
        run: |
          set -e
          # Имя пакета и номер сборки — из введённых значений.
          if [ -z "$APP_ID" ]; then
            APP_ID=$(node -e "
              const u = new URL('${{ inputs.site }}');
              console.log(u.host.split('.').reverse().join('.').replace(/[^a-z0-9.]/gi, ''));
            ")
          fi
          export APP_ID
          export APP_VERSION_CODE=$(node -e "
            const p = '${{ inputs.version }}'.split('.').map(Number);
            console.log((p[0]||0) * 10000 + (p[1]||0) * 100 + (p[2]||0) || 1);
          ")
          echo "Пакет: $APP_ID, сборка $APP_VERSION_CODE"

          gradle -p android-app --no-daemon assembleRelease bundleRelease

      - name: Собрать результаты
        run: bash tools/android-collect.sh "${{ inputs.name }}" "${{ steps.keystore.outputs.created }}"

      - uses: actions/upload-artifact@v4
        with:
          name: wolffmsg-android
          path: out/*
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------------
  #  Обёртка над сайтом (TWA): пакет крошечный, интерфейс каждый раз берётся
  #  с сайта. Зато работают уведомления при закрытом приложении.
  # ------------------------------------------------------------------------
  twa:
    if: inputs.kind == 'обёртка над сайтом'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Подготовить настройки приложения
        run: node tools/twa-config.mjs "${{ inputs.site }}" "${{ inputs.package }}" "${{ inputs.name }}" "${{ inputs.version }}"

      - name: Ключ подписи
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          bash tools/android-keystore.sh "${{ inputs.name }}"
          cp android.keystore android/android.keystore

      - name: Собрать приложение
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'wolffmsg' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'wolffmsg' }}
        run: |
          set -e
          npm install -g @bubblewrap/cli@latest
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" \
            > "$HOME/.bubblewrap/config.json"
          cd android
          bubblewrap update --skipVersionUpgrade || echo "update пропущен — проект соберёт build"
          bubblewrap build --skipPwaValidation

      - name: Отпечаток ключа и файл связки с сайтом
        env:
          PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'wolffmsg' }}
        run: |
          set -e
          mkdir -p out
          FP=$(keytool -list -v -keystore android.keystore -alias wolffmsg \
                -storepass "$PASS" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ' \r')
          export FP
          node tools/assetlinks.mjs > out/assetlinks.json
          {
            echo "### Обёртка над сайтом собрана"
            echo ""
            echo "Чтобы приложение открывалось без адресной строки браузера, добавьте в"
            echo "репозиторий файл \`.well-known/assetlinks.json\` с таким содержимым:"
            echo ""
            echo '```json'
            cat out/assetlinks.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Собрать результаты
        run: bash tools/android-collect.sh "${{ inputs.name }}" "${{ steps.keystore.outputs.created }}"

      - uses: actions/upload-artifact@v4
        with:
          name: wolffmsg-android-twa
          path: out/*
          if-no-files-found: error
          retention-days: 30
