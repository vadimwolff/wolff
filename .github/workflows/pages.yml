name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Собрать статическую папку
        run: |
          mkdir -p _site
          cp index.html sw.js _site/
          cp -r assets _site/
          # Jekyll не нужен, иначе он может съесть служебные файлы
          touch _site/.nojekyll

      # enablement: true включает Pages в репозитории автоматически,
      # если это ещё не сделано вручную в Settings → Pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
